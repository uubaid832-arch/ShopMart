# smtp keeps the existing local Gmail setup. Set SHOPMART_MAIL_PROVIDER=brevo for HTTPS delivery.
shopmart.mail.provider=${SHOPMART_MAIL_PROVIDER:smtp}
shopmart.mail.sender-name=ShopMart
shopmart.brevo.api-key=${SHOPMART_BREVO_API_KEY:}

# In Brevo mode this must match the verified Brevo sender email.
spring.mail.username=${SHOPMART_MAIL_USERNAME}

# Used only in smtp mode. No Gmail App Password is required in brevo mode.
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.password=${SHOPMART_MAIL_APP_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.ssl.checkserveridentity=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

shopmart.otp.secret=${SHOPMART_OTP_SECRET}
