spring.application.name=shopmart-api

spring.datasource.url=${SHOPMART_DB_URL:jdbc:postgresql://localhost:5432/shopmart}
spring.datasource.username=${SHOPMART_DB_USER:shopmart_app}
spring.datasource.password=${SHOPMART_DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
shopmart.jwt.secret=${SHOPMART_JWT_SECRET}
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=32MB

shopmart.upload-dir=${SHOPMART_UPLOAD_DIR:./uploads/products}

# Gemini API key is configured as a backend environment variable (for example on Render).
shopmart.assistant.gemini.api-key=${GEMINI_API_KEY:}
shopmart.assistant.gemini.model=${GEMINI_MODEL:gemini-3.5-flash-lite}

spring.config.import=optional:classpath:otp-mail.properties,optional:classpath:cloudinary.properties
