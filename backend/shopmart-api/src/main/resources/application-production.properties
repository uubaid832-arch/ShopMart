# Activated by the Docker image; local Vite/Spring development keeps its current defaults.
server.address=0.0.0.0
server.port=${PORT:8080}
server.forward-headers-strategy=framework

# Both website and API are served from the same HTTPS origin.
shopmart.auth.cookie-secure=true
spring.web.error.include-message=never
spring.web.error.include-stacktrace=never

# Fail rather than silently using the local development database in production.
spring.datasource.url=${SHOPMART_DB_URL}
spring.datasource.username=${SHOPMART_DB_USER}
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.datasource.hikari.minimum-idle=0
# Keep connection headroom for REQUIRES_NEW rate-limit transactions and mail processing.
spring.datasource.hikari.maximum-pool-size=12
server.tomcat.threads.max=8

# Render Free uses HTTPS email delivery and external image storage.
shopmart.mail.provider=brevo
shopmart.cloudinary.enabled=true
shopmart.cloudinary.migrate-local=false
shopmart.upload-dir=/tmp/shopmart/uploads/products
